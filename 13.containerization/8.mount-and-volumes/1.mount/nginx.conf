events {
    worker_connections 1024;
}

http {

    resolver 172.30.0.10;

    server {
        listen 80;
        location / {
            default_type  text/html;
            return  200 "time: $date_gmt";
        }
        location /time {
            default_type application/json;
            return 200 '{"status":"success","time":"$time_local", "msec":"$msec"}';
        }
        location /error {
            default_type  text/html;
            return  500;
        }
    }
}